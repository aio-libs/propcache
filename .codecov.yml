---

codecov:
  notify:
    after_n_builds: 19  # The number of test matrix+lint jobs uploading coverage
    wait_for_ci: false

  require_ci_to_pass: false

  token: >-  # notsecret  # repo-scoped, upload-only, stability in fork PRs
    0b255cf3-ed51-43a8-b7df-8a9f23da39b1

comment:
  require_changes: true

coverage:
  range: 99.34..100
  status:
    patch:
      default:
        target: 100%
    project:
      default:
        target: 92.46%  # 100%
      lib-combined:
        paths:
        - src/propcache/
        target: 100%
      lib-cython:
        paths:
        - src/propcache/*.pyx
        - src/propcache/**/*.pyx
        target: 100%
      lib-python:
        paths:
        - src/propcache/*.py
        - src/propcache/**/*.py
        target: 100%
      packaging:
        paths:
        - packaging/
        # The build backend only gained test coverage in #302, so it
        # cannot be held to the library standard yet. ``auto`` only
        # forbids decreases; raise this to a fixed target once the
        # coverage has grown to match the rest of the repo.
        target: auto
      tests:
        paths:
        - tests/
        target: 100%

...
